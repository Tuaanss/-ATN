<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">
  <rect width="1200" height="760" fill="#FAFAF7"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#1A1C21">Phương án logo – kho bài nộp đa phương tiện</text>
  <text x="40" y="88" font-size="15" fill="#62666F">Màu chủ đạo giữ đỏ #DB0000 của giao diện hiện tại</text>

  <!-- 1. EduMosaic -->
  <g transform="translate(40,120)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,40)">
      <rect width="46" height="46" rx="10" fill="#DB0000"/>
      <path d="M9 36 L19 23 L26 31 L31 26 L38 36 Z" fill="#fff"/><circle cx="31" cy="15" r="4" fill="#fff"/>
      <rect x="52" width="46" height="46" rx="10" fill="#1A1C21"/>
      <path d="M69 13 L84 23 L69 33 Z" fill="#fff"/>
      <rect y="52" width="46" height="46" rx="10" fill="#1A1C21"/>
      <path d="M17 66 L11 75 L17 84 M29 66 L35 75 L29 84" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="52" y="52" width="46" height="46" rx="10" fill="#F2AAAA"/>
      <path d="M64 63 H86 M64 72 H86 M64 81 H78" stroke="#9B1C12" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Edu<tspan fill="#DB0000">Mosaic</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Bức tranh ghép từ mọi sản phẩm học tập</text>
    <text x="36" y="200" font-size="14" fill="#30343B">4 ô = ảnh · video · mã nguồn · báo cáo.</text>
    <text x="36" y="224" font-size="14" fill="#30343B">Mỗi bài nộp là một mảnh ghép tạo nên hồ sơ của sinh viên.</text>
    <text x="36" y="262" font-size="13" font-weight="700" fill="#DB0000">★ Đề xuất</text>
  </g>

  <!-- 2. FrameUp -->
  <g transform="translate(620,120)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,40)">
      <rect width="98" height="98" rx="22" fill="#DB0000"/>
      <path d="M22 38 V24 H36 M62 24 H76 V38 M76 60 V74 H62 M36 74 H22 V60" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M49 64 V36 M38 46 L49 35 L60 46" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Frame<tspan fill="#DB0000">Up</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Đóng khung &amp; tải lên sản phẩm</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Khung ảnh/video + mũi tên tải lên: đúng việc SV làm</text>
    <text x="36" y="224" font-size="14" fill="#30343B">mỗi ngày trên hệ thống. Ngắn, dễ đọc, dễ làm favicon.</text>
  </g>

  <!-- 3. MediaFolio -->
  <g transform="translate(40,440)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,44)">
      <path d="M0 18 Q0 8 10 8 H36 L46 18 H88 Q98 18 98 28 V80 Q98 90 88 90 H10 Q0 90 0 80 Z" fill="#DB0000"/>
      <path d="M40 38 L64 53 L40 68 Z" fill="#fff"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Media<tspan fill="#DB0000">Folio</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Hồ sơ sản phẩm đa phương tiện</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Thư mục + nút phát: gợi thẳng "kho lưu bài đa phương tiện",</text>
    <text x="36" y="224" font-size="14" fill="#30343B">liên hệ với thư mục Google Drive của giảng viên.</text>
  </g>

  <!-- 4. StudyPrism -->
  <g transform="translate(620,440)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,44)">
      <path d="M8 49 H34" stroke="#1A1C21" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 8 L80 84 H20 Z" fill="#DB0000"/>
      <path d="M66 46 L98 30 M70 54 L98 54 M66 62 L98 78" stroke-width="5" stroke-linecap="round" fill="none" stroke="#F2AAAA"/>
      <path d="M70 54 L98 54" stroke="#DB0000" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Study<tspan fill="#DB0000">Prism</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Một bài tập – nhiều dạng sản phẩm</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Lăng kính tách một tia sáng thành nhiều màu, như một</text>
    <text x="36" y="224" font-size="14" fill="#30343B">đề bài cho ra ảnh, video, mã nguồn, báo cáo.</text>
  </g>
</svg>
