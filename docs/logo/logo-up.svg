<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Be Vietnam Pro','Segoe UI',Arial,sans-serif">
  <rect width="1200" height="760" fill="#FAFAF7"/>
  <text x="40" y="58" font-size="28" font-weight="700" fill="#1A1C21">Phương án tên có chữ “UP”</text>
  <text x="40" y="88" font-size="15" fill="#62666F">Màu chủ đạo giữ đỏ #DB0000 của giao diện hiện tại</text>

  <!-- 1. SnapUp -->
  <g transform="translate(40,120)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,40)">
      <rect width="98" height="98" rx="22" fill="#DB0000"/>
      <rect x="18" y="30" width="62" height="46" rx="9" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M38 30 L43 22 H55 L60 30" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
      <path d="M49 66 V44 M41 51 L49 43 L57 51" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Snap<tspan fill="#DB0000">Up</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Chụp lại · tải lên · được săn đón</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Máy ảnh + mũi tên tải lên. “Snap up” trong tiếng Anh còn</text>
    <text x="36" y="224" font-size="14" fill="#30343B">nghĩa là “săn ngay” – hợp với doanh nghiệp tìm sinh viên.</text>
    <text x="36" y="262" font-size="13" font-weight="700" fill="#DB0000">★ Đề xuất</text>
  </g>

  <!-- 2. ShowUp -->
  <g transform="translate(620,120)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,40)">
      <rect width="98" height="98" rx="22" fill="#1A1C21"/>
      <rect x="16" y="24" width="66" height="44" rx="6" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M43 36 L60 46 L43 56 Z" fill="#DB0000"/>
      <path d="M36 80 H62" stroke="#DB0000" stroke-width="6" stroke-linecap="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Show<tspan fill="#DB0000">Up</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Trình diễn sản phẩm học tập</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Màn hình trình chiếu + nút phát: mỗi bài nộp là một buổi</text>
    <text x="36" y="224" font-size="14" fill="#30343B">“trình diễn”. Dễ đọc, dễ nhớ với sinh viên.</text>
  </g>

  <!-- 3. UpFolio -->
  <g transform="translate(40,440)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,44)">
      <path d="M0 18 Q0 8 10 8 H36 L46 18 H88 Q98 18 98 28 V80 Q98 90 88 90 H10 Q0 90 0 80 Z" fill="#DB0000"/>
      <path d="M49 74 V40 M37 52 L49 40 L61 52" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#DB0000">Up<tspan fill="#1A1C21">Folio</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Tải lên hồ sơ sản phẩm</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Thư mục + mũi tên lên: gần với tên cũ EduPortfolio,</text>
    <text x="36" y="224" font-size="14" fill="#30343B">nhắc đến thư mục Google Drive lưu bài.</text>
  </g>

  <!-- 4. FrameUp -->
  <g transform="translate(620,440)">
    <rect width="540" height="290" rx="16" fill="#fff" stroke="#E3E1D9"/>
    <g transform="translate(36,44)">
      <rect width="98" height="98" rx="22" fill="#DB0000"/>
      <path d="M22 38 V24 H36 M62 24 H76 V38 M76 60 V74 H62 M36 74 H22 V60" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M49 64 V36 M38 46 L49 35 L60 46" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="160" y="90" font-size="40" font-weight="800" fill="#1A1C21">Frame<tspan fill="#DB0000">Up</tspan></text>
    <text x="162" y="120" font-size="15" fill="#62666F">Đóng khung &amp; tải lên sản phẩm</text>
    <text x="36" y="200" font-size="14" fill="#30343B">Khung ngắm + mũi tên tải lên, nhấn vào ảnh và video.</text>
    <text x="36" y="224" font-size="14" fill="#30343B">Ngắn, làm favicon rõ.</text>
  </g>
</svg>
