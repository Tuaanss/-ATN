<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduPortfolio · Giao diện Admin & Phụ huynh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
  .uc{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);color:var(--ink)}
  .uc:hover{background:#FCFCFA;color:var(--ink)}
  .uc .ext{margin-left:28px;font-size:13px}
  .uc small{color:var(--mut);font-size:12px}
</style>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</head>
<body>
<header class="top" style="position:static"><a class="logo" href="index.html" style="flex:1"><span class="logo-mark" id="logo-ic"></span><b>EduPortfolio</b></a><button class="btn btn-sm" id="reset"></button></header>
<main style="max-width:1100px;margin:0 auto;padding:36px 16px 60px;display:flex;flex-direction:column;gap:24px">
  <div class="stack" style="gap:8px"><h1 class="h1">Giao diện web — Quản trị viên & Phụ huynh</h1>
    <p class="muted" style="line-height:1.6;max-width:760px">Mỗi màn hình tương ứng một use case trong biểu đồ phân rã. Dữ liệu là dữ liệu mẫu, thao tác (thêm, sửa, khóa, duyệt, import, đổi mật khẩu…) được lưu trong trình duyệt để demo luồng nghiệp vụ.</p></div>
  <div class="grid g2" id="cards"></div>
</main>
<script>
document.addEventListener('app:ready', () => {
  const { ic } = App;
  document.getElementById('logo-ic').innerHTML = ic('book', 18, 2);
  const r = document.getElementById('reset'); r.innerHTML = ic('refresh', 16) + ' Khôi phục dữ liệu mẫu';
  r.onclick = async () => { if (await App.confirm({ title: 'Khôi phục dữ liệu mẫu', msg: 'Xóa mọi thay đổi đã thực hiện trong bản demo và nạp lại dữ liệu ban đầu?', ok: 'Khôi phục', danger: true })) { Store.reset(); Store.save(); App.toast('Đã khôi phục dữ liệu mẫu.'); } };
  const G = [
    ['Admin', 'Quản trị hệ thống', 'shield', '#DB0000', [
      ['admin/giang-vien.html', 'Quản lý tài khoản giảng viên', 'FR-02.1'],
      ['admin/sinh-vien.html', 'Quản lý tài khoản sinh viên', 'FR-02.2'],
      ['admin/import-sinh-vien.html', 'Import sinh viên từ Excel', '«extend» Quản lý TK SV', 1],
      ['admin/phu-huynh.html', 'Quản lý tài khoản phụ huynh', 'FR-02.4'],
      ['admin/doanh-nghiep.html', 'Duyệt tài khoản doanh nghiệp', 'FR-02.3'],
      ['admin/danh-muc.html', 'Quản lý danh mục', 'FR-02.5'],
      ['admin/hoc-ky-mon-hoc.html', 'Quản lý học kỳ, môn học', 'FR-04.1, 04.2'],
      ['admin/lop-hoc-phan.html', 'Quản lý lớp học phần', 'FR-04.3'],
      ['admin/nhat-ky.html', 'Nhật ký hệ thống', 'FR-17'],
      ['admin/cau-hinh.html', 'Cấu hình hệ thống', 'FR-02.7']]],
    ['Phụ huynh', 'Xem kết quả học tập của con/em', 'user', '#B45309', [
      ['phu-huynh/dang-nhap.html', 'Đăng nhập bằng SĐT', 'FR-11.1'],
      ['phu-huynh/doi-mat-khau.html?first=1', 'Đổi mật khẩu lần đầu', '«extend» Đăng nhập', 1],
      ['phu-huynh/chon-con.html', 'Chọn con cần xem', '«extend» Đăng nhập', 1],
      ['phu-huynh/ket-qua.html', 'Xem điểm, GPA, CPA của con', 'FR-11.3'],
      ['phu-huynh/bai-nop.html', 'Xem bài nộp của con', 'FR-11.2'],
      ['phu-huynh/thong-bao.html', 'Xem thông báo, cảnh báo học tập', 'FR-11.4']]],
  ];
  document.getElementById('cards').innerHTML = G.map(([a, d, i, c, items]) => `<section class="card" style="overflow:hidden">
    <div class="card-h" style="border-bottom:0"><div class="cell-user"><span class="av" style="background:${c};color:#fff">${ic(i, 18)}</span><div><b style="font-size:16px">${a}</b><span>${d}</span></div></div><span class="badge b-gray">${items.length} màn hình</span></div>
    ${items.map(([h, t, s, ext]) => `<a class="uc" href="${h}"><span class="${ext ? 'ext' : ''}" style="display:flex;flex-direction:column;gap:2px;flex:1"><span style="font-weight:${ext ? 500 : 600}">${t}</span><small>${s}</small></span><span class="muted">${ic('right', 16)}</span></a>`).join('')}
  </section>`).join('');
});
</script>
</body>
</html>
