# Dùng khi máy có Docker mà chưa cài MySQL: docker compose -f docker/compose.dev.yml up -d
# (Đã cài MySQL 8 trên máy thì không cần file này – xem README.)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: frameup
      MYSQL_USER: frameup
      MYSQL_PASSWORD: frameup
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
